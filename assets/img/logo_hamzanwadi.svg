<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100" height="100">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>
  
  <!-- Outer Pentagon / Circular Badge -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="#1b5e20" stroke-width="5" />
  <circle cx="100" cy="100" r="88" fill="url(#greenGrad)" />
  <circle cx="100" cy="100" r="70" fill="#ffffff" stroke="#ffd700" stroke-width="3" />

  <!-- University Name Ring (Simulated Text) -->
  <path id="textPathTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
  <path id="textPathBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  
  <!-- Emblems in Center -->
  <!-- Star at Top -->
  <polygon points="100,45 104,56 116,56 106,63 110,74 100,67 90,74 94,63 84,56 96,56" fill="#ffd700" />
  
  <!-- Open Book -->
  <path d="M 68,118 Q 100,108 100,126 Q 100,108 132,118 L 132,95 Q 100,85 100,103 Q 100,85 68,95 Z" fill="#ffffff" stroke="#1b5e20" stroke-width="2.5" />
  <path d="M 100,103 L 100,126" stroke="#1b5e20" stroke-width="2.5" />

  <!-- Quill / Pen -->
  <path d="M 98,72 L 102,72 L 100,100 Z" fill="#1b5e20" />
  
  <!-- Rice and Cotton Wreath -->
  <path d="M 52,115 C 50,140 70,158 100,162 C 130,158 150,140 148,115" fill="none" stroke="#ffd700" stroke-width="4" stroke-dasharray="6,4" />

  <!-- Text -->
  <text font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">UNIVERSITAS</textPath>
  </text>
  <text font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">HAMZANWADI</textPath>
  </text>
</svg>
