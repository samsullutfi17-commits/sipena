  <!-- Code text -->
  <text x="48" y="92" font-family="monospace" font-size="12" fill="#0284c7">package</text>
  <text x="105" y="92" font-family="monospace" font-size="12" fill="#334155">hello_world;</text>
  
  <text x="48" y="132" font-family="monospace" font-size="12" fill="#0284c7">public class</text>
  <text x="140" y="132" font-family="monospace" font-size="12" fill="#0f172a" font-weight="bold">Main</text>
  <text x="175" y="132" font-family="monospace" font-size="12" fill="#334155">{</text>
  
  <text x="68" y="152" font-family="monospace" font-size="12" fill="#0284c7">public static void</text>
  <text x="210" y="152" font-family="monospace" font-size="12" fill="#16a34a" font-weight="bold">main</text>
